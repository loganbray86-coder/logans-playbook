<header><h1>🏈 LOGAN'S PLAYBOOK</h1><select id="scsel" onchange="setSc(this.value)" style="font-size:11px;padding:4px"><option value="1,4">PPR · 4pt PTD</option><option value="1,6">PPR · 6pt PTD</option><option value="0.5,4">Half · 4pt</option><option value="0.5,6">Half · 6pt</option><option value="0,4">Std · 4pt</option><option value="0,6">Std · 6pt</option></select><div class="sub" id="upd">loading…</div></header>
<nav id="nav"></nav><main id="main"><div class="card">Loading real data from FantasyPros, FantasyCalc, RotoTrade seed, Sleeper…</div></main>
<datalist id="names"></datalist><div id="modal" onclick="if(event.target==this)this.style.display='none'"></div>
<script>
const TABS=[["rank","📊","Rankings"],["ss","✅","Start/Sit"],["team","👕","My Team"],["wav","➕","Waivers"],["trade","🔄","Trade"],["league","🏆","Leagues"],["scores","📺","Scores"],["news","🚑","Injuries"],["stats","📈","Stats"],["sos","🗓️","SOS"],["finder","🔎","Finder"],["plan","🗺️","Planner"],["report","📋","Report"],["edge","⚡","Edge"],["vals","💲","Values"]];
let D,P,tab=location.hash.slice(1)||"rank",S={mode:"wk",pos:"ALL",q:"",lg:"WAN",ss:["","","",""],A:[],B:[],fcT:12,vs:"fc12",vd:-1,avail:""};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=()=>D.rosters.leagues, myTeam=lg=>L()[lg].my_team, isMine=(p,lg)=>p.owners&&p.owners[lg]===myTeam(lg);
const fcv=(p,t)=>p[t==16?"fc16":"fc12"]; const wp=p=>p.wk&&p.wk.pts!=null?p.wk.pts:null; const ro=p=>p.ros&&p.ros.overall?p.ros.overall:9999;
const posNum=p=>p.ros&&p.ros.pos_num?p.ros.pos_num:999;
function badges(p){let s="";if(isMine(p,"WAN"))s+='<span class="b bW">W</span>';if(isMine(p,"SLOPE"))s+='<span class="b bS">S</span>';
 if(p.inj)s+=`<span class="inj ${/Out|IR|Doubt|Sus|PUP/.test(p.inj)?"injO":""}">${esc(p.inj[0]=="I"&&p.inj=="IR"?"IR":p.inj.slice(0,1))}</span>`;return s}
const nm=p=>`<b class="pl" onclick="openP('${p.key}')">${esc(p.name)}</b>${badges(p)} <span class="mut">${esc(p.team||"")}</span>`;const pb=p=>`<span class="pos ${p.pos}">${p.pos}</span>`;
const byKey=k=>P.find(p=>p.key===k); const findName=n=>P.find(p=>p.name.toLowerCase()===n.trim().toLowerCase());
async function load(r){D=await (await fetch("/api/data"+(r?"?refresh=1":""))).json();P=D.players;
 $("#names").innerHTML=P.map(p=>`<option value="${esc(p.name)}">${p.pos} ${esc(p.team||"")}</option>`).join("");
 const st=D.status,f=k=>st[k]?(st[k].ok?st[k].fetched:"FAILED"):"–";
 $("#upd").innerHTML=`FP Wk${D.meta.weekly?.week} upd ${D.meta.weekly?.updated} · ROS ${D.meta.ros?.updated}<br>FC ${f("fc12")} · RT as of ${D.rt_as_of} · Sleeper ${f("sleeper")}`;render()}
function nav(){$("#nav").innerHTML=TABS.map(([k,i,t])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')"><i>${i}</i>${t}</button>`).join("")}
function go(t){tab=t;location.hash=t;render();scrollTo(0,0)}
function render(){nav();$("#main").innerHTML=({rank,ss,team,wav,trade,league,scores,news,vals,stats,sos,finder,plan,report,edge})[tab]();if(tab=="scores")loadScores()}
function pills(key,opts,cb){return opts.map(o=>`<span class="pill ${S[key]==o[0]?"on":""}" onclick="S.${key}='${o[0]}';${cb||"render()"}">${o[1]}</span>`).join("")}
const lgPills=()=>pills("lg",[["WAN","WAN 2027 (12)"],["SLOPE","Slopeside (16)"]]);
/* ---------- Rankings ---------- */
function rankList(){let l=P.filter(p=>!p.unranked);const flex=["RB","WR","TE"];
 if(S.pos=="FLEX")l=l.filter(p=>flex.includes(p.pos));else if(S.pos!="ALL")l=l.filter(p=>p.pos==S.pos);
 if(S.mode=="wk"){l=l.filter(p=>p.wk);l.sort(S.pos=="ALL"||S.pos=="FLEX"?(a,b)=>wp(b)-wp(a):(a,b)=>a.wk.rank-b.wk.rank)}
 else{l=l.filter(p=>p.ros);l.sort(S.pos=="ALL"||S.pos=="FLEX"?(a,b)=>ro(a)-ro(b)||posNum(a)-posNum(b):(a,b)=>posNum(a)-posNum(b))}
 if(S.q)l=l.filter(p=>p.name.toLowerCase().includes(S.q.toLowerCase()));return l}
function rank(){const l=rankList(),w=S.mode=="wk";
 return `<div class="card"><div class="row">${pills("mode",[["wk","Week "+(D.meta.weekly?.week||"")],["ros","Rest of Season"]])}</div>
 <div class="row">${pills("pos",["ALL","QB","RB","WR","TE","FLEX","DST","K"].map(x=>[x,x]))}<input placeholder="Search player" value="${esc(S.q)}" oninput="S.q=this.value;document.getElementById('rt').innerHTML=rankRows()" style="flex:1;min-width:140px"></div>
 <div class="mut">${w?(S.pos=="ALL"||S.pos=="FLEX"?"Sorted by FantasyPros weekly PPR projection (no cross-position weekly ECR exists).":"FantasyPros weekly PPR ECR."):"FantasyPros ROS PPR ECR (overall rank from ros-ppr-overall)."} <span class="b bW">W</span>=WAN <span class="b bS">S</span>=Slopeside</div>
 <div class="tw"><table><thead><tr><th>#</th><th>Player</th><th>Pos</th>${w?"<th>Opp</th><th class=num>Proj</th><th>Grade</th>":"<th>Ovr</th><th>Bye</th>"}<th>Best</th><th>Worst</th><th>Avg</th><th>SD</th></tr></thead><tbody id="rt">${rankRows()}</tbody></table></div></div>`}
function rankRows(){const w=S.mode=="wk";return rankList().slice(0,400).map((p,i)=>{const r=w?p.wk:p.ros;
 return `<tr class="${p.owners?"mine":""}"><td>${i+1}</td><td>${nm(p)}</td><td>${pb(p)} ${esc(r.pos_rank||"")}</td>${w?`<td>${esc(p.opp||"")}</td><td class=num>${wp(p)??"-"}</td><td>${esc(r.grade||"")}</td>`:`<td>${p.ros.overall||"-"}</td><td>${esc(p.bye||"")}</td>`}<td>${esc(r.best??"")}</td><td>${esc(r.worst??"")}</td><td>${esc(r.avg??"")}</td><td>${esc(r.std??"")}</td></tr>`}).join("")}
/* ---------- Start/Sit ---------- */
function ss(){const ps=S.ss.map(findName).filter(Boolean);ps.forEach(p=>{p._g=mg(p);p._adj=adjP(p)});const srt=ps.slice().sort((a,b)=>b._adj-a._adj),best=srt[0];
 const conf=srt.length>1&&best._adj>0?Math.min(95,Math.round(50+(best._adj-srt[1]._adj)/best._adj*150)):null;
 return `<div class="card"><h2>Start/Sit Compare</h2><div class="row">${S.ss.map((v,i)=>`<input list="names" placeholder="Player ${i+1}" value="${esc(v)}" onchange="S.ss[${i}]=this.value;render()">`).join("")}</div>
 ${ps.length>=2?`<div class="verdict" style="background:#12391f">START: ${esc(best.name)} <span class="mut">(${wp(best)??0} proj · ${conf}% confidence)</span></div><div class="grid" style="margin-top:10px">${ps.map(p=>`<div class="card" style="${p==best?"border-color:var(--grn)":""}">${pb(p)} ${nm(p)}<div class="big">${wp(p)??"BYE/–"}</div><div class="mut">Wk rank ${p.wk?.pos_rank||"–"} · ECR ${p.wk?.rank||"–"} · grade ${p.wk?.grade||"–"}</div><div>Matchup: ${esc(p.opp||"no game listed")} ${gr(p._g)} <span class="mut">adj ${p._adj.toFixed(1)}</span></div><div class="mut">Expert range ${p.wk?.best||"-"}–${p.wk?.worst||"-"}</div><div>ROS ${p.ros?.pos_rank||"–"} (ovr ${p.ros?.overall||"–"})</div>${p.inj?`<div class="bad">${esc(p.inj)} ${esc(p.inj_part||"")}</div>`:""}</div>`).join("")}</div><div class="mut">Pick = FantasyPros weekly PPR projection adjusted ±10% by matchup grade (A…F = fantasy pts allowed by opponent to the position, nflverse ${D.adv_season} thru wk ${D.adv_thru}). Confidence scales with the adjusted gap to #2.</div>`:'<div class="mut">Choose 2–4 players.</div>'}</div>`}
/* ---------- lineup ---------- */
const elig=(slot,p)=>slot=="FLEX"?["RB","WR","TE"].includes(p.pos):slot==p.pos;
function roster(lg){const ir=L()[lg].ir||[];return P.filter(p=>isMine(p,lg)).map(p=>({...p,_ir:ir.includes(p.name)}))}
function optimal(lg,score,list){list=list||roster(lg).filter(p=>!p._ir);const used=new Set(),out=[];const slots=L()[lg].slots;
 const order=slots.map((s,i)=>[s,i]).sort((a,b)=>(a[0]=="FLEX")-(b[0]=="FLEX"));const res=[];
 for(const [s,i] of order){const c=list.filter(p=>!used.has(p.key)&&elig(s,p)).sort((a,b)=>score(b)-score(a))[0];if(c)used.add(c.key);res[i]={slot:s,p:c}}
 return {lineup:res,bench:list.filter(p=>!used.has(p.key))}}
function team(){const lg=S.lg,r=roster(lg),{lineup,bench}=optimal(lg,p=>wp(p)??-1);
 const warn=r.filter(p=>!p._ir&&(wp(p)==null||wp(p)<1)).map(p=>`<div class="warn">⚠️ ${esc(p.name)}: ${wp(p)==null?"no Week "+D.meta.weekly.week+" projection (bye or not ranked)":"projected "+wp(p)}${p.inj?" · "+esc(p.inj):""}</div>`).join("");
 const notes=lineup.map(({slot,p})=>{if(!p)return `<div class="bad">No eligible player for ${slot}</div>`;const alt=bench.filter(b=>elig(slot,b)).sort((a,b)=>(wp(b)??-1)-(wp(a)??-1))[0];
  return `<div>✅ <b>${slot}: ${esc(p.name)}</b> (${wp(p)??0})${alt?` over ${esc(alt.name)} (${wp(alt)??"bye"}) — +${((wp(p)??0)-(wp(alt)??0)).toFixed(1)} proj pts${p.opp?", "+esc(p.opp):""}`:""}</div>`}).join("");
 const unm=(D.unmatched[lg]||[]);const tot=lineup.reduce((s,x)=>s+(x.p?wp(x.p)??0:0),0);
 return `<div class="card"><div class="row">${lgPills()}</div><h2>${esc(L()[lg].name)} · ${esc(myTeam(lg))}</h2>${L()[lg].notes?`<div class="mut">${esc(L()[lg].notes)}</div>`:""}${warn}${unm.length?`<div class="mut">Not in FP rankings: ${unm.map(esc).join(", ")}</div>`:""}</div>
 ${autopilot(lg)}${apCard(lg)}<div class="card"><h2>Start/Sit Assistant: optimal lineup <span class="mut">(${tot.toFixed(1)} proj)</span></h2>${notes}<div class="mut" style="margin-top:6px">Built from FantasyPros weekly PPR projections. Your current ESPN lineup isn't read here; compare and set changes in ESPN.</div></div>
 <div class="card"><div class="tw"><table><thead><tr><th>Slot</th><th>Player</th><th>Opp</th><th class=num>Proj</th><th>Wk</th><th>ROS</th><th>Ovr</th><th class=num>RT</th><th class=num>FC</th></tr></thead><tbody>
 ${lineup.concat(bench.map(p=>({slot:"BN",p}))).concat(r.filter(p=>p._ir).map(p=>({slot:"IR",p}))).map(({slot,p})=>p?`<tr><td><b>${slot}</b></td><td>${pb(p)} ${nm(p)}</td><td>${esc(p.opp||"BYE/–")}</td><td class=num>${wp(p)??"-"}</td><td>${p.wk?.pos_rank||"-"}</td><td>${p.ros?.pos_rank||"-"}</td><td>${p.ros?.overall||"-"}</td><td class=num>${p.rt??"-"}</td><td class=num>${fcv(p,L()[lg].teams_count)??"-"}</td></tr>`:"").join("")}</tbody></table></div></div>`}
/* ---------- Waivers ---------- */
function owned(p,lg){return p.owners&&p.owners[lg]}
function wav(){const lg=S.lg,av=S.avail.split(/[\n,;]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
 let pool=P.filter(p=>p.ros&&!owned(p,lg));if(av.length)pool=pool.filter(p=>av.includes(p.name.toLowerCase()));const cap=lg=='SLOPE'?75:60;const likely=av.length?pool:pool.filter(p=>p.own!=null&&p.own<cap);
 if(S.pos!="ALL")pool=pool.filter(p=>S.pos=="FLEX"?["RB","WR","TE"].includes(p.pos):p.pos==S.pos);pool.sort((a,b)=>ro(a)-ro(b)||posNum(a)-posNum(b));
 const r=roster(lg).filter(p=>!p._ir),sug=[];
 for(const pos of ["QB","RB","WR","TE","DST","K"]){const mine=r.filter(p=>p.pos==pos);if(!mine.length)continue;const drop=mine.sort((a,b)=>posNum(b)-posNum(a))[0];
  const add=likely.filter(p=>p.pos==pos).sort((a,b)=>posNum(a)-posNum(b))[0];if(add&&posNum(add)<posNum(drop))sug.push({add,drop})}
 return `<div class="card"><div class="row">${lgPills()}</div><h2>Waiver Assistant</h2><div class="warn">⚠️ ESPN availability is NOT checked. These players aren't on Logan's roster${Object.keys(L()[lg].teams).length>1?" or other listed teams":""}; they may be owned in ESPN. Without a pasted list, ADD suggestions only use players rostered in under ${lg=='SLOPE'?75:60}% of leagues (FantasyPros avg roster %) as a likely-available proxy. Paste ESPN's free-agent names below to restrict to truly available players.</div>
 <textarea placeholder="Optional: paste available player names (one per line or comma separated)" onchange="S.avail=this.value;render()">${esc(S.avail)}</textarea>
 ${sug.map(({add,drop})=>`<div class="card" style="margin:8px 0">📈 <b>ADD ${esc(add.name)}</b> ${pb(add)} · <b class="bad">DROP ${esc(drop.name)}</b><div class="mut">Why: ROS ${add.ros.pos_rank} (ovr ${add.ros.overall||"–"}) vs your lowest ${pos(drop)} ${drop.ros?.pos_rank||"unranked"}${add.wk?` · this week ${wp(add)} vs ${wp(drop)??"bye"}`:""}${add.inj?" · injury: "+esc(add.inj):""} · usage ${add.adv?add.adv.trend+" ("+add.adv.trend_val+")":"n/a"} · ROS SOS ${sosG(add,"ros")||"–"} · playoff SOS ${sosG(add,lg=="WAN"?"wan_po":"slope_po")||"–"}</div></div>`).join("")||'<div class="mut">No add beats your lowest ROS player at any position.</div>'}</div>
 <div class="card"><h2>Top ranked players not on your team</h2><div class="row">${pills("pos",["ALL","QB","RB","WR","TE","FLEX","DST","K"].map(x=>[x,x]))}</div><div class="tw"><table><thead><tr><th>Player</th><th>Pos</th><th>ROS</th><th>Ovr</th><th class=num>Own%</th><th class=num>Wk proj</th><th>Opp</th><th>Trend</th><th>ROS SOS</th><th>PO SOS</th><th class=num>RT</th><th class=num>FC</th></tr></thead><tbody>${pool.slice(0,150).map(p=>`<tr><td>${nm(p)}${p.owners?` <span class="mut">(${esc(Object.values(p.owners).join(","))})</span>`:""}</td><td>${pb(p)}</td><td>${p.ros.pos_rank}</td><td>${p.ros.overall||"-"}</td><td class=num>${p.own??"-"}</td><td class=num>${wp(p)??"-"}</td><td>${esc(p.opp||"")} ${gr(mg(p))}</td><td>${arrow(p)} ${p.adv?p.adv.trend_val:""}</td><td>${gr(sosG(p,"ros"))}</td><td>${gr(sosG(p,lg=="WAN"?"wan_po":"slope_po"))}</td><td class=num>${p.rt??"-"}</td><td class=num>${fcv(p,L()[lg].teams_count)??"-"}</td></tr>`).join("")}</tbody></table></div></div>`}
const pos=p=>p.pos;
/* ---------- Trade ---------- */
function gradeSide(a,b,k){const A=a.reduce((s,p)=>s+(p[k]||0),0),B=b.reduce((s,p)=>s+(p[k]||0),0),miss=[...a,...b].filter(p=>p[k]==null).map(p=>p.name);
 const net=B-A,pct=Math.max(A,B)?net/Math.max(A,B):0;return {A,B,net,pct,miss,v:pct>.05?"win":pct<-.05?"over":"fair"}}
function verdict(rt,fc){const lab={win:"YOU WIN",over:"YOU OVERPAY",fair:"FAIR"};const g=[rt,fc].filter(x=>!x.miss.length||x.B+x.A>0&&!x.miss.length);
 if(rt.miss.length&&!fc.miss.length)return [lab[fc.v],"FantasyCalc only (missing RotoTrade value: "+rt.miss.join(", ")+")",fc.v];
 if(rt.v==fc.v)return [lab[rt.v],"Both graders agree",rt.v];if(rt.v=="fair"||fc.v=="fair"){const o=rt.v=="fair"?fc.v:rt.v;return ["LEAN "+lab[o],"One grader says fair, the other says "+lab[o].toLowerCase(),o]}
 return ["SPLIT","Graders disagree (RT "+lab[rt.v]+", FC "+lab[fc.v]+")","fair"]}
function tradeBox(){const a=S.A.map(byKey).filter(Boolean),b=S.B.map(byKey).filter(Boolean),k="fc"+S.fcT;if(!a.length||!b.length)return '<div class="mut">Add players to both sides.</div>';

S.rec=1;S.ptd=4;try{const v=localStorage.sc;if(v){[S.rec,S.ptd]=v.split(",").map(Number)}}catch(e){}

function findDeals(lg){const T=L()[lg].teams_count,k="fc"+T,mine=roster(lg).filter(p=>!p._ir),others=Object.keys(L()[lg].teams).filter(t=>t!=myTeam(lg));
 const {lineup}=optimal(lg,p=>p[k]||0,mine);let weak=null;lineup.forEach(({slot,p})=>{if(!p||!["QB","RB","WR","TE"].includes(p.pos))return;const n=L()[lg].slots.filter(s=>s==p.pos).length,r=posNum(p)/(T*n);if(!weak||r>weak.r)weak={r,p}});
 const res=[],within=(a,b,key)=>{const A=a.reduce((s,p)=>s+(p[key]??NaN),0),B=b.reduce((s,p)=>s+(p[key]??NaN),0);return isFinite(A)&&isFinite(B)&&Math.abs(B-A)/Math.max(A,B)<=.05?B-A:null};
 const give=mine.filter(p=>p[k]&&p!==weak.p&&["QB","RB","WR","TE"].includes(p.pos));
 const test=(a,g,t)=>{const f=within(a,[g],k);if(f==null)return;const hasRT=[...a,g].every(p=>p.rt!=null),r=hasRT?within(a,[g],"rt"):null;if(hasRT&&r==null)return;res.push({t,give:a,get:g,r,f,src:hasRT?"RT+FC":"FC only"})};
 for(const t of others){P.filter(p=>p.owners&&p.owners[lg]===t&&p.pos==weak.p.pos&&posNum(p)<posNum(weak.p)).forEach(g=>{give.forEach(a=>test([a],g,t));for(let i=0;i<give.length;i++)for(let j=i+1;j<give.length;j++)test([give[i],give[j]],g,t)})}
 res.sort((a,b)=>(a.src!="RT+FC")-(b.src!="RT+FC")||posNum(a.get)-posNum(b.get)||Math.abs(a.f)-Math.abs(b.f));return {weak,res,others}}

function streamers(lg,pos,w){return P.filter(p=>p.pos==pos&&p.team&&!owned(p,lg)).map(p=>{const o=oppOf(p.team,w);if(!o)return null;const ts=D.team_stats||{},me=ts[tc(p.team)]||{},op=ts[o]||{};

 for(let w=D.cur_week+1;w<=17;w++){const avail=r.filter(p=>oppAt(p,w)),{lineup}=optimal(lg,p=>1000-ro(p),avail),full=optimal(lg,p=>1000-ro(p),r).lineup;

 const cuffs=r.filter(p=>p.pos=="RB"&&p.cuff).map(p=>{const c=findName(p.cuff);return `<div>• ${esc(p.name)} → <b>${esc(p.cuff)}</b> <span class=mut>${c?(owned(c,lg)?"rostered by "+esc(c.owners[lg]):"not on a loaded roster")+" · ROS "+(c.ros?.pos_rank||"unranked"):""}</span></div>`}).join("");
 return `<div class="card"><div class="row">${lgPills()}</div><h2>Waiver Planner · Weeks ${D.cur_week+1}–17</h2><div class="mut">Bye holes use the ROS-best lineup. D/ST streamers favor opponents with low offensive PPR output and high giveaways (INT + fumbles + ½ sacks per game, nflverse ${D.adv_season}). K streamers favor strong own offense facing generous defenses. Only players not on a loaded ${esc(L()[lg].name)} roster are listed${L()[lg].partial?` (WAN is partial: ${esc(L()[lg].partial)}, so confirm in ESPN)`:""}.</div>

 <div class="card"><h2>Handcuff targets</h2>${cuffs||"<div class=mut>No depth chart data</div>"}<div class="mut">Next RB on each team's Sleeper depth chart.</div></div>`}

 for(const g of ["QB","RB","WR","TE"]){const n=slots.filter(s=>s==g).length+(g=="RB"||g=="WR"?1:0);const v=teams.map(t=>[t,P.filter(p=>p.owners?.[lg]===t&&p.pos==g).map(p=>p[k]||0).sort((a,b)=>b-a).slice(0,n).reduce((a,b)=>a+b,0)]).sort((a,b)=>b[1]-a[1]);
