  <div class="swap"><div class="get"><div class="lab">ADD</div><div class="nm">${esc(w.a.name)}</div><div class="xs">${esc(w.a.pos)} ${esc(w.a.team||"")} · ROS ${esc(w.a.ros?.pos_rank||"—")}</div>${tags(w.a)}</div><div class="ar">${I.arrow}</div><div class="give"><div class="lab">DROP</div><div class="nm">${esc(w.d.name)}</div><div class="xs">${esc(w.d.pos)} ${esc(w.d.team||"")} · ROS ${esc(w.d.ros?.pos_rank||"unranked")}</div>${tags(w.d)}</div></div>
  <div class="why"><b>Why:</b> FantasyPros ROS ${esc(w.a.ros.pos_rank)} vs ${esc(w.d.ros?.pos_rank||"unranked")}; FantasyCalc ${fmt(fcv(w.a))} vs ${fmt(fcv(w.d))}. ${w.a.wk?.pts!=null&&!onBye(w.a)?"Week "+D.cur_week+" proj "+w.a.wk.pts.toFixed(1)+".":""} ${w.a.own!=null?"Rostered in "+Math.round(w.a.own)+"% of leagues.":""}</div>
  <div class="btns"><button class="go" onclick="mkW('${w.id}')">Make Move</button><button class="no" onclick="dismiss('${w.id}')">Dismiss</button></div></div>`).join(""):`<div class="card"><div class="empty"><b>No pickups right now</b>Nobody available beats your weakest bench player by enough to be worth a move.</div></div>`;
  h+=`<div class="note">Free agents = players not on any roster loaded for this league${l.partial?" ("+esc(l.partial)+"), so verify on ESPN":""}. Drops never include starters, K/DST, or Chase Brown / Breece Hall.</div>`}
 else{const T=trades();
  h+=T.map(t=>{const id=`t:${lg}:${t.A.key}:${t.B.key}`,th=needLine(t.team).filter(q=>q!==t.B.pos);const why=[...t.why];if(th.length&&!why.some(w=>w.includes("thin")))why.unshift(`Their roster is thin at ${th.join(", ")}`);
   return `<div class="card pad"><div style="display:flex;align-items:center;gap:12px">${helm(t.team,40)}<div><div class="nm" style="font-size:16px">${esc(t.team)}</div><div class="sm">${esc(t.mgr||"Manager unknown")}${th.length?` · needs ${th.join("/")}`:""}</div></div></div>
   <div class="swap"><div class="give"><div class="lab">YOU GIVE</div><div class="nm">${esc(t.A.name)}</div><div class="xs">${esc(t.A.pos)} · ROS ${esc(t.A.ros?.pos_rank||"—")}</div>${tags(t.A)}</div><div class="ar">${I.arrow}</div><div class="get"><div class="lab">YOU GET</div><div class="nm">${esc(t.B.name)}</div><div class="xs">${esc(t.B.pos)} · ROS ${esc(t.B.ros?.pos_rank||"—")}</div>${tags(t.B)}</div></div>
   <div class="grd"><div>RotoTrade ROS<b class="${t.dR>0?"up":""}">${sgn(t.dR)}</b>${t.A.rt} → ${t.B.rt}</div><div>FantasyCalc ROS<b class="${t.dF>0?"up":""}">${sgn(t.dF)}</b>${fmt(fcv(t.A))} → ${fmt(fcv(t.B))}</div></div>
   <div class="why"><b>Why they'd accept</b><ul>${why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
   <div class="btns"><button class="go" onclick='mkT(${JSON.stringify({id,team:t.team,mgr:t.mgr,a:t.A.name,b:t.B.name,dR:t.dR,dF:t.dF}).replace(/'/g,"&#39;")})'>Make the Move</button><button class="no" onclick="dismiss('${id}')">Dismiss</button></div></div>`}).join("");
  if(T.length<3)h+=`<div class="card"><div class="empty"><b>${T.length?"That's every deal that passes":"No trades pass right now"}</b>Only 1-for-1 offers where you're even or ahead on both RotoTrade and FantasyCalc, a partner need explains why they'd say yes, and nobody involved is injured or Brown/Hall. Rosters update every 5 min, so check back.</div></div>`;
  h+=`<div class="note">ROS impact = value you get minus value you send (RotoTrade seed ${esc(D.rt_as_of)}; FantasyCalc ${l.teams_count}-team PPR redraft). Players without both values are skipped, never guessed.${l.partial?" "+esc(l.partial)+".":""}</div>`}
 return h}
function mkW(id){const w=waivers().find(x=>x.id===id),l=L();openGM(`APPROVE ${LT(lg)} (${l.my_team}): add ${w.a.name} (${w.a.pos} ${w.a.team||""}), drop ${w.d.name}`,`Waiver move · verify ${w.a.name} is available`)}
function mkT(t){const l=L();openGM(`APPROVE ${LT(lg)} (${l.my_team}): send trade offer to ${t.team} (${t.mgr}): I give ${t.a}, I get ${t.b}`,`Trade · RotoTrade ${sgn(t.dR)}, FantasyCalc ${sgn(t.dF)} for you`)}
function sheet(t,n,p){openGM(p,t+": "+n)}
const QC2=["Approve lineup","Who should I start?","Grade this trade","Who should I pick up?","Injury check"];
function openGM(pre,ctx){$("shN").textContent=ctx||(D?`${LN(lg)} · ${L().my_team}`:"");$("gmT").value=pre||"";
 $("qc").innerHTML=QC2.map(q=>`<button onclick="qcp('${q}')">${q}</button>`).join("");drawH();$("sheet").classList.add("on");setTimeout(()=>{const t=$("gmT");t.style.height="auto";t.style.height=Math.min(120,t.scrollHeight)+"px"},0)}
function qcp(q){let t;if(q==="Approve lineup"&&D)t=lineTxt(lineups(),lg);else t=`${LT(lg)} (${D?L().my_team:""}): ${q}${q==="Grade this trade"?" — I give: ___ / I get: ___":""}`;const e=$("gmT");e.value=t;e.style.height="auto";e.style.height=Math.min(120,e.scrollHeight)+"px";e.focus()}
function drawH(){const h=JSON.parse(localStorage.gmHist||"[]");$("hist").innerHTML=`<div class="bub gm">Hey Logan, I'm your GM. Tap a chip or type a question. Send hands it to your Grok Bot chat, and I'll answer and make the ESPN move there once you approve.</div>`+h.slice(-15).map(m=>`<div class="bub me">${esc(m.t)}<small>${new Date(m.at).toLocaleString([],{weekday:"short",hour:"numeric",minute:"2-digit"})} · ${m.via}</small></div>`).join("");const b=$("hist").parentNode;b.scrollTop=1e6}
function closeSheet(){$("sheet").classList.remove("on")}
async function sendGM(){const t=$("gmT").value.trim();if(!t)return;let via="copied";
 if(navigator.share){try{await navigator.share({text:t});via="shared"}catch(e){if(e.name==="AbortError")return;copyTxt(t)}}else copyTxt(t);
 const h=JSON.parse(localStorage.gmHist||"[]");h.push({t,at:Date.now(),via});localStorage.gmHist=JSON.stringify(h.slice(-50));$("gmT").value="";drawH();
 toast(via==="shared"?"Shared. Make sure it goes to your Grok Bot chat":"Copied, paste it in your Grok Bot chat")}
function render(){$("tabs").innerHTML=TABS2.map(([id,ic,lab])=>`<button class="${tab===id||(tab==="team"&&id==="home")?"on":""}" onclick="tab='${id}';localStorage.tab=tab;render();scrollTo(0,0)">${I[ic]}${lab}</button>`).join("");
 if(!D)return;try{$("main").innerHTML={home:vHome,team:vTeam,rank:vRank,moves:vMoves,news:vNews}[tab]()}catch(e){$("main").innerHTML=`<div class="card pad dn">Error: ${esc(e.message)}</div>`;console.error(e)}}
if(localStorage.theme==="dark")document.documentElement.classList.add("dark");document.documentElement.classList.remove("light");
$("thB").innerHTML=document.documentElement.classList.contains("dark")?I.sun:I.moon;$("rf").innerHTML=I.refresh;$("fab").innerHTML=I.spark;$("lnX").innerHTML=I.x;$("gmX").innerHTML=I.x;$("cpB").innerHTML=I.send;

render();load().catch(e=>{$("main").innerHTML='<div class="empty">Couldn\'t load data. Tap Refresh.</div>'});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")softRefresh()});
window.addEventListener("focus",()=>softRefresh());
setInterval(()=>{if(document.visibilityState==="visible")softRefresh()},5*60*1000);
setInterval(setUpd,30*1000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").then(reg=>{
  if(reg&&reg.update)reg.update();
}).catch(()=>{});
</script></body></html>
