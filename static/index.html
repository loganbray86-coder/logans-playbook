<header><button class="cb hl" onclick="theme()" title="Theme">◐</button><div style="text-align:center"><h1>My Playbook</h1><div class="upd" id="upd">Loading…</div></div><div class="hr"><button class="cb" id="rf" onclick="refresh()" title="Refresh">⟳</button></div></header>

<script>
const TABS=[["home","📋","Playbook"],["moves","⇄","Moves"],["rank","☷","Rankings"],["news","📰","News"]];if(localStorage.theme!=="dark")document.documentElement.classList.add("light");function theme(){const c=document.documentElement.classList.toggle("light");localStorage.theme=c?"light":"dark";document.querySelector("meta[name=theme-color]").content=c?"#ffffff":"#0d1117"}
let D=null,NEWS=[],tab=["home","moves","rank","news","team"].includes(localStorage.tab)?localStorage.tab:"home",lg=localStorage.lg||"WAN",rk={mode:"wk",pos:"RB",q:""},mvSeg="w";
const dis=JSON.parse(localStorage.dismissed||"{}");
const $=s=>document.getElementById(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=n=>String(n).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[.'`]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\b(jr|sr|ii|iii|iv|v)\b/g,"").split(/\s+/).filter(Boolean).join(" ");
const fmt=n=>n==null?"n/a":Math.round(n).toLocaleString();
const sgn=n=>n==null?"n/a":(n>0?"+":"")+(Math.abs(n)>=100?Math.round(n).toLocaleString():(Math.round(n*10)/10));
async function load(force){
  const [d,n]=await Promise.all([fetch("/api/data").then(r=>r.json()),fetch("/api/news").then(r=>r.json()).catch(()=>({items:[]}))]);
  D=d;NEWS=n.items||[];D.byKey={};D.players.forEach(p=>D.byKey[p.key]=p);
  $("upd").textContent="Updated "+new Date(D.built*1000).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})+" · Week "+D.cur_week;render();
}
async function refresh(){const b=$("rf");b.classList.add("spin");b.disabled=true;$("upd").textContent="Refreshing FantasyPros, FantasyCalc, Sleeper, schedule, news…";
  try{const r=await fetch("/api/refresh",{method:"POST"});if(!r.ok)throw 0;await load();}catch(e){$("upd").textContent="Refresh failed; showing last data";}
  b.classList.remove("spin");b.disabled=false;}
function L(){return D.rosters.leagues[lg]}
function myKeys(id){const l=D.rosters.leagues[id||lg];return (D.rosters.resolved[id||lg]||{})[l.my_team]||[]}
function status(p,id){const l=D.rosters.leagues[id||lg];const o=(l.espn_status||{})[p.name];if(o)return o;
  if((l.ir||[]).includes(p.name))return "IR";const m={Questionable:"Q",Doubtful:"D",Out:"O",IR:"IR",PUP:"IR",Sus:"O"};return m[p.inj]||null}
const onBye=p=>String(p.bye)===String(D.cur_week);
const pts=p=>p.wk&&p.wk.pts!=null?p.wk.pts:0;
const locked=p=>p.game_status&&p.game_status!=="scheduled"||(p.kickoff&&p.kickoff*1000<Date.now());
const okStart=(p,id)=>!onBye(p)&&!["O","D","IR"].includes(status(p,id));
function tags(p,id){let s="";const st=status(p,id);if(st)s+=`<span class="tag t${st}">${st}</span>`;if(onBye(p))s+=`<span class="tag tBYE">BYE</span>`;if(locked(p)&&!onBye(p))s+=`<span class="tag tL">LOCKED</span>`;return s}
const FLEX={FLEX:["RB","WR","TE"]};
function lineups(){
  const l=L(),slots=l.slots,keys=myKeys().filter(k=>!(l.ir||[]).includes(D.byKey[k].name)),ps=keys.map(k=>D.byKey[k]);
  const cur=slots.map((s,i)=>({slot:s,p:ps[i]})),bench=ps.slice(slots.length);
  const opt=slots.map(s=>({slot:s,p:null}));const used=new Set();
  cur.forEach((c,i)=>{if(c.p&&locked(c.p)&&!onBye(c.p)){opt[i].p=c.p;used.add(c.p.key)}});
  const lockedBench=new Set(bench.filter(p=>locked(p)).map(p=>p.key));
  const fit=(s,p)=>(FLEX[s]||[s]).includes(p.pos);
  for(const pass of [0,1])opt.forEach(o=>{if(o.p||(pass===0)===(o.slot==="FLEX"))return;
    const c=ps.filter(p=>!used.has(p.key)&&!lockedBench.has(p.key)&&!(locked(p)&&!onBye(p)&&!bench.includes(p)&&false)&&fit(o.slot,p)&&okStart(p)&&!(locked(p)&&cur.some(x=>x.p===p))).sort((a,b)=>pts(b)-pts(a));
    if(c[0]){o.p=c[0];used.add(c[0].key)}});
  opt.forEach((o,i)=>{if(!o.p&&cur[i].p&&!used.has(cur[i].p.key)){o.p=cur[i].p;o.forced=true;used.add(o.p.key)}});
  const S=new Set(opt.filter(o=>o.p).map(o=>o.p)),forcedS=new Set(opt.filter(o=>o.forced).map(o=>o.p));
  const fin=cur.map(c=>({slot:c.slot,p:c.p&&S.has(c.p)?c.p:null}));fin.forEach(f=>{if(forcedS.has(f.p))f.forced=true});
  const rem=[...S].filter(p=>!fin.some(f=>f.p===p));
  for(const p of rem){let f=fin.find(f=>!f.p&&fit(f.slot,p));
    if(!f){const e=fin.find(f=>!f.p);const fx=fin.find(g=>g.slot==="FLEX"&&g.p&&fit(e.slot,g.p)&&!locked(g.p));if(e&&fx){e.p=fx.p;f=fx}else f=e}
    if(f){f.p=p;f.forced=forcedS.has(p)}}

  const changes=[];opt.forEach((o,i)=>{if(o.p!==cur[i].p)changes.push({slot:o.slot,inP:o.p,outP:cur[i].p})});
  return {cur,opt,bench,changes,curT:tot(cur),optT:tot(opt)};
}
function vHome(){const save=lg;let h=`<div class="lgH"><h2>My Leagues</h2><span class="sm">ESPN</span></div>`;
 for(const [id,l] of Object.entries(D.rosters.leagues).sort((a,b)=>a[0]==="WAN"?-1:1)){lg=id;const x=lineups(),m=l.matchup||{},tot=(m.me||0)+(m.opp_score||0),pct=tot?m.me/tot*100:50;
  const sg=x.changes.map(c=>`<div class="pr"><div style="font-size:20px">⇅</div><div><div class="nm">Start/Sit: ${esc(c.inP?.name)} over ${esc(c.outP?.name||"empty")}</div><div class="sm up">+${((okStart(c.inP)?pts(c.inP):0)-(c.outP&&okStart(c.outP)?pts(c.outP):0)).toFixed(1)} projected pts</div></div></div>`);
  const bad=x.opt.filter(o=>o.forced||(o.p&&!okStart(o.p)));bad.forEach(o=>sg.push(`<div class="pr"><div style="font-size:20px">⚠</div><div><div class="nm">No eligible ${o.slot}</div><div class="sm dn">${esc(o.p?.name||"")} can't play. See Moves for a pickup.</div></div></div>`));
  h+=`<div class="card lc"><div class="lch" onclick="lg='${id}';localStorage.lg=lg;tab='team';render();scrollTo(0,0)"><div class="hel">🏈</div><div><div class="n">${esc(l.name)}</div><div class="sm">ESPN • ${esc(l.place||"")} (${esc(l.wl||"")})</div></div><div style="margin-left:auto;color:var(--mut);font-size:22px">›</div></div>
  <div class="mu"><div class="tn"><span>${esc(l.my_team)}</span><span>${esc(m.opp||"")}</span></div><div class="sc"><div style="text-align:right"><b>${(m.me??0).toFixed(2)}</b><div class="sm up">${x.optT.toFixed(1)} proj</div></div><div class="vs">vs</div><div><b>${(m.opp_score??0).toFixed(2)}</b><div class="sm">proj n/a</div></div></div>
  <div class="bar"><div style="flex:${pct};background:var(--grn)"></div><div style="flex:${100-pct};background:var(--mut)"></div></div><div class="sm" style="text-align:center;margin-top:6px">Live scores as of last refresh (${esc(m.as_of||"")}) · bar = current score share, not win probability</div></div>
  <details class="sg" ${sg.length?"open":""}><summary><span class="cnt" style="${sg.length?"":"background:var(--grn)"}">${sg.length||"✓"}</span>${sg.length?`Week ${D.cur_week} suggestion${sg.length>1?"s":""} available`:"Lineup is optimal"}</summary>${sg.join("")}${x.changes.length?`<button class="big" onclick="lg='${id}';setLineup()">Set Optimal Lineup</button>`:""}</details></div>`}
 lg=save;return h+`<div class="note">Your-team projection = FantasyPros Week ${D.cur_week} PPR for the optimal lineup. Opponent projections and win probability aren't available without ESPN access, so they're not shown.</div>`}
function prow(slot,p,extra){if(!p)return `<div class="pr"><div class="slot">${slot}</div><div class="mut">Empty</div></div>`;
  return `<div class="pr"><div class="slot">${slot}</div><div><div class="nm">${esc(p.name)}${tags(p)}</div><div class="sm">${p.pos} · ${p.team||""} ${onBye(p)?"· bye":esc(p.opp||"")} ${p.wk?.pos_rank?"· "+p.wk.pos_rank:""}</div></div><div class="pts">${p.wk?.pts!=null?p.wk.pts.toFixed(1):'<span class="mut">—</span>'}${extra||""}</div></div>`}

function vTeam(){
  const l=L(),x=lineups();let h=`<button class="lnk" onclick="tab='home';render()">‹ My Playbook</button>`+lgSwitch();
  h+=`<div class="sum"><div><span class="sm">Record</span><b>${esc((l.record||"").split(" ")[0]||"—")}</b></div><div><span class="sm">Current proj</span><b>${x.curT.toFixed(1)}</b></div><div><span class="sm">Optimal proj</span><b class="${x.optT>x.curT+.05?"up":""}">${x.optT.toFixed(1)}</b></div></div>`;
  if(x.changes.length){h+=`<div class="ttl">Recommended changes</div><div class="card">${x.changes.map(c=>`<div class="mv"><span class="pill add">IN</span><b>${esc(c.inP?.name||"—")}</b><span class="mut">→ ${c.slot}</span></div><div class="mv" style="margin-bottom:10px"><span class="pill drp">OUT</span>${esc(c.outP?.name||"Empty")}${c.outP?tags(c.outP):""}</div>`).join("")}
  <button class="big" onclick="setLineup()">Set Optimal Lineup (+${(x.optT-x.curT).toFixed(1)})</button></div>`}
  else h+=`<div class="card" style="text-align:center"><b class="up">✓ Your lineup is already optimal</b><div class="note">Based on FantasyPros Week ${D.cur_week} PPR projections</div><button class="big off" onclick="setLineup()">Set Optimal Lineup</button></div>`;
  const forced=x.opt.filter(o=>o.forced||(o.p&&!okStart(o.p)));
  if(forced.length)h+=`<div class="card" style="border-color:var(--red)"><b class="dn">⚠ No eligible starter for ${forced.map(o=>o.slot).join(", ")}</b><div class="note">${forced.map(o=>esc(o.p?.name||"")).join(", ")} can't play or is locked and nobody on your bench can fill it. Check Moves for a pickup.</div></div>`;
  h+=`<div class="ttl">Optimized lineup</div><div class="card">${x.opt.map(o=>prow(o.slot,o.p,o.p&&!x.cur.find(c=>c.p===o.p&&c.slot===o.slot)?'<div class="sm up">new</div>':"")).join("")}</div>`;
  h+=`<div class="ttl">Current ESPN lineup</div><div class="card">${x.cur.map(o=>prow(o.slot,o.p)).join("")}</div>`;
  h+=`<div class="ttl">Bench</div><div class="card">${x.bench.map(p=>prow("BN",p)).join("")}${(l.ir||[]).map(n=>{const p=myKeys().map(k=>D.byKey[k]).find(q=>q.name===n);return p?prow("IR",p):""}).join("")}</div>`;
  h+=`<div class="note">Rosters verified on ESPN ${esc(D.rosters.as_of)}. Projections: FantasyPros ECR Week ${D.cur_week} (${esc(D.meta.weekly?.updated)}). Never starts bye, Out, Doubtful or IR players. Locked players (game started) stay put.</div>`;
  return h}
function setLineup(){const x=lineups(),l=L();
  const txt=x.changes.length?`APPROVE ${lg==="WAN"?"WAN":"SLOPESIDE"} (${l.my_team}) LINEUP: `+x.changes.map(c=>`start ${c.inP?.name} at ${c.slot}`+(c.outP?`, bench ${c.outP.name}`:"")).join("; "):`${lg==="WAN"?"WAN":"SLOPESIDE"} (${l.my_team}): verify my lineup matches the optimal lineup, no changes expected`;
  sheet("Set Optimal Lineup",x.changes.length?`${x.changes.length} change(s), projected +${(x.optT-x.curT).toFixed(1)} pts`:"No changes needed",txt)}
function vRank(){
  const P=D.players.filter(p=>p.pos===rk.pos&&(rk.mode==="wk"?p.wk:p.ros?.pos_num)).sort((a,b)=>rk.mode==="wk"?a.wk.rank-b.wk.rank:a.ros.pos_num-b.ros.pos_num);
  const q=norm(rk.q),list=q?P.filter(p=>norm(p.name).includes(q)):P;
  let h=lgSwitch()+`<div class="seg"><button class="${rk.mode==="wk"?"on":""}" onclick="rk.mode='wk';render()">Week ${D.cur_week}</button><button class="${rk.mode==="ros"?"on":""}" onclick="rk.mode='ros';render()">Rest of Season</button></div>`;
  h+=`<div class="chips">${["QB","RB","WR","TE","K","DST"].map(p=>`<button class="${rk.pos===p?"on":""}" onclick="rk.pos='${p}';render()">${p}</button>`).join("")}</div>`;
  h+=`<input type="search" placeholder="Search players" value="${esc(rk.q)}" oninput="rk.q=this.value;document.getElementById('rl').innerHTML=rankRows()">`;
  return h+`<div class="card" id="rl">${rankRows()}</div><div class="note">FantasyPros expert consensus, PPR (${rk.mode==="wk"?"weekly "+esc(D.meta.weekly?.updated):"ROS "+esc(D.meta.ros?.updated)}). Badges are for the league selected above.</div>`}
function rankRows(){const q=norm(rk.q);const P=D.players.filter(p=>p.pos===rk.pos&&(rk.mode==="wk"?p.wk:p.ros?.pos_num)&&(!q||norm(p.name).includes(q))).sort((a,b)=>rk.mode==="wk"?a.wk.rank-b.wk.rank:a.ros.pos_num-b.ros.pos_num).slice(0,q?60:120);
  if(!P.length)return '<div class="empty">No players found</div>';const me=L().my_team;
  return P.map(p=>{const o=p.owners?.[lg];const b=o===me?'<span class="own">MINE</span>':o?'<span class="own t">TAKEN</span>':"";
  return `<div class="pr"><div class="rk">${rk.mode==="wk"?p.wk.rank:p.ros.pos_num}</div><div><div class="nm">${esc(p.name)}${b}${tags(p)}</div><div class="sm">${p.team||""} ${rk.mode==="wk"?esc(p.opp||""):"· Ovr "+(p.ros.overall??"—")}</div></div><div class="pts">${rk.mode==="wk"?(p.wk.pts!=null?p.wk.pts.toFixed(1):"—")+'<div class="sm">proj</div>':(p.ros.pos_rank||"")}</div></div>`}).join("")}
const fcv=p=>p[L().teams_count===16?"fc16":"fc12"]??null, rtv=p=>p.rt??null;
function waivers(){const l=L(),mine=myKeys().map(k=>D.byKey[k]),x=lineups(),starters=new Set(x.opt.map(o=>o.p?.key));
  const unt=new Set(l.untouchable||[]);
  const drops=mine.filter(p=>!starters.has(p.key)&&!["K","DST"].includes(p.pos)&&!unt.has(p.name)&&!(l.ir||[]).includes(p.name)&&!locked(p));
  const fa=D.players.filter(p=>["QB","RB","WR","TE"].includes(p.pos)&&!(p.owners&&p.owners[lg])&&!p.unranked&&p.ros?.pos_num&&!["O","IR"].includes(status(p))&&fcv(p)!=null);
  const out=[];
  fa.sort((a,b)=>fcv(b)-fcv(a)).forEach(a=>{if(out.length>=6)return;
    const ds=drops.filter(d=>fcv(d)!=null&&!out.some(o=>o.d===d)).sort((p,q)=>fcv(p)-fcv(q));const d=ds[0];if(!d)return;
    if(fcv(a)<=fcv(d)*1.15)return;
    const id=`w:${lg}:${a.key}:${d.key}`;if(dis[id])return;out.push({a,d,id})});
  return out}
function trades(){const l=L(),me=l.my_team,unt=new Set(lg==="SLOPE"?(l.untouchable||[]):[]),R=D.rosters.resolved[lg]||{};
  const mine=myKeys().map(k=>D.byKey[k]).filter(p=>["QB","RB","WR","TE"].includes(p.pos)&&!unt.has(p.name)&&!locked(p)&&!["O","IR"].includes(status(p)));
  const out=[];
  for(const [team,keys] of Object.entries(R)){if(team===me)continue;const theirs=keys.map(k=>D.byKey[k]).filter(p=>["QB","RB","WR","TE"].includes(p.pos)&&!locked(p));
    for(const A of mine)for(const B of theirs){const ra=rtv(A),rb=rtv(B),fa=fcv(A),fb=fcv(B);
      if([ra,rb,fa,fb].some(v=>v==null))continue;const dR=rb-ra,dF=fb-fa;
      if(dR<0||dF<0||dR>8||dF>fa*.25+150)continue;
      // why they'd accept
      const why=[];
      const posT=theirs.filter(p=>p.pos===A.pos&&p.ros?.pos_num).sort((a,b)=>a.ros.pos_num-b.ros.pos_num);
      const need={QB:1,RB:2,WR:3,TE:1}[A.pos];
      if(A.ros?.pos_num&&(posT.length<need||posT[need-1].ros.pos_num>A.ros.pos_num))why.push(`They're thin at ${A.pos}: ${A.name} (ROS ${A.ros.pos_rank}) would be ${posT.length<need?"a needed starter":"an upgrade over "+posT[need-1].name+" ("+posT[need-1].ros.pos_rank+")"}`);
      const bD=theirs.filter(p=>p.pos===B.pos&&p!==B&&p.ros?.pos_num&&B.ros?.pos_num&&p.ros.pos_num<B.ros.pos_num+12).length;
      if(B.pos!==A.pos&&bD>={QB:1,RB:2,WR:3,TE:1}[B.pos])why.push(`They have ${bD} other ${B.pos}s ranked near ${B.name}, so they can spare him`);
      const pa=okStart(A)?pts(A):0,pb=okStart(B)?pts(B):0;if(pa-pb>=2)why.push(`Wins them this week: ${A.name} projects ${pa.toFixed(1)} vs ${B.name} ${pb?pb.toFixed(1):"0 ("+(onBye(B)?"bye":status(B)||"no proj")+")"}`);
      if(!why.length)continue;
      const id=`t:${lg}:${A.key}:${B.key}`;if(dis[id])continue;
      out.push({team,mgr:(l.managers||{})[team]||"",A,B,dR,dF,why,score:why.length*10-dR-dF/200});}}
  out.sort((a,b)=>b.score-a.score);const seen=new Set(),res=[];
  for(const t of out){const k=t.A.key+"|"+t.team;if(seen.has(t.A.key+t.B.key)||res.filter(r=>r.A===t.A).length>=2||res.filter(r=>r.team===t.team).length>=2)continue;seen.add(t.A.key+t.B.key);res.push(t);if(res.length>=8)break}
  return res}
function vMoves(){const l=L();let h=lgSwitch()+`<div class="seg"><button class="${mvSeg==="w"?"on":""}" onclick="mvSeg='w';render()">Waivers</button><button class="${mvSeg==="t"?"on":""}" onclick="mvSeg='t';render()">Trades</button></div>`;
  if(mvSeg==="w"){const W=waivers();
    h+=W.length?W.map((w,i)=>`<div class="card"><div class="sm" style="font-weight:800;color:var(--yel)">PICKUP #${i+1} · VERIFY AVAILABILITY</div>
    <div class="mv"><span class="pill add">ADD</span><b>${esc(w.a.name)}</b><span class="sm">${w.a.pos} ${w.a.team||""}</span>${tags(w.a)}</div>
    <div class="mv"><span class="pill drp">DROP</span><b>${esc(w.d.name)}</b><span class="sm">${w.d.pos} ${w.d.team||""}</span>${tags(w.d)}</div>
    <div class="why">Why: FantasyPros ROS ${w.a.ros.pos_rank} vs ${esc(w.d.name)} ${w.d.ros?.pos_rank||"unranked"}. FantasyCalc ${fmt(fcv(w.a))} vs ${fmt(fcv(w.d))}. Week ${D.cur_week}: ${w.a.wk?.pts!=null&&!onBye(w.a)?w.a.wk.pts.toFixed(1)+" proj":"no proj / bye"}. ${w.a.own!=null?"Rostered in "+Math.round(w.a.own)+"% of FP-synced leagues.":""}</div>
    <div class="btns"><button class="go" onclick="mkW('${w.id}')">Make Move</button><button class="no" onclick="dismiss('${w.id}')">Dismiss</button></div></div>`).join(""):`<div class="empty">No pickups beat your bench right now.</div>`;
    h+=`<div class="note">Free agents = players not on any roster loaded for this league${l.partial?" ("+esc(l.partial)+"), so some may be taken: verify on ESPN":""}. Drops never include your starters, kickers/DSTs${lg==="SLOPE"?", Chase Brown or Breece Hall":""}.</div>`}
  else{const T=trades();
    h+=T.length?T.map(t=>`<div class="card"><div style="font-weight:800">${esc(t.team)}</div><div class="sm">Manager: ${esc(t.mgr||"unknown")}</div>
    <div class="mv" style="margin-top:8px"><span class="pill drp">SEND</span><b>${esc(t.A.name)}</b><span class="sm">${t.A.pos} · ROS ${t.A.ros?.pos_rank||"—"}</span>${tags(t.A)}</div>
    <div class="mv"><span class="pill add">GET</span><b>${esc(t.B.name)}</b><span class="sm">${t.B.pos} · ROS ${t.B.ros?.pos_rank||"—"}</span>${tags(t.B)}</div>
    <div class="grd"><div>RotoTrade<b class="up">${sgn(t.dR)}</b>${t.A.rt} → ${t.B.rt}</div><div>FantasyCalc<b class="up">${sgn(t.dF)}</b>${fmt(fcv(t.A))} → ${fmt(fcv(t.B))}</div></div>
    <div class="why"><b>Why they'd accept:</b><br>• ${t.why.map(esc).join("<br>• ")}</div>
    <div class="btns"><button class="go" onclick='mkT(${JSON.stringify({id:`t:${lg}:${t.A.key}:${t.B.key}`,team:t.team,mgr:t.mgr,a:t.A.name,b:t.B.name,dR:t.dR,dF:t.dF})})'>Make the Move</button><button class="no" onclick="dismiss('t:${lg}:${t.A.key}:${t.B.key}')">Dismiss</button></div></div>`).join(""):`<div class="empty">No trades right now where you're even or ahead on both graders.</div>`;
    h+=`<div class="note">ROS impact = value you get minus value you send. Only 1-for-1 deals where you're even or ahead on BOTH RotoTrade (seed values ${esc(D.rt_as_of)}, ${Object.keys(D.players.filter(p=>p.rt!=null)).length} players) and FantasyCalc (${L().teams_count}-team PPR redraft). Players without a RotoTrade value are skipped, never guessed. ${lg==="SLOPE"?"Chase Brown and Breece Hall are never offered. ":""}Locked (game started) players are excluded.</div>`}
  return h}
function mkW(id){const w=waivers().find(x=>x.id===id),l=L();sheet("Waiver move",`${lg==="WAN"?"WAN 2027":"Slopeside"} · ${l.my_team}. Verify ${w.a.name} is available on ESPN.`,`APPROVE ${lg==="WAN"?"WAN":"SLOPESIDE"} (${l.my_team}): add ${w.a.name} (${w.a.pos} ${w.a.team||""}), drop ${w.d.name}`)}
function mkT(t){const l=L();sheet("Trade offer",`To ${t.team} (${t.mgr||"manager unknown"}). RotoTrade ${sgn(t.dR)}, FantasyCalc ${sgn(t.dF)} for you.`,`APPROVE ${lg==="WAN"?"WAN":"SLOPESIDE"} (${l.my_team}): send trade offer to ${t.team} (${t.mgr}): I give ${t.a}, I get ${t.b}`)}
function dismiss(id){dis[id]=Date.now();localStorage.dismissed=JSON.stringify(dis);render()}
function vNews(){const ids=Object.keys(D.rosters.leagues),seen={};
  ids.forEach(id=>myKeys(id).forEach(k=>{const p=D.byKey[k];(seen[k]=seen[k]||{p,lg:[],st:null}).lg.push(id);seen[k].st=seen[k].st||status(p,id)}));
  const all=Object.values(seen),hurt=all.filter(x=>x.st||onBye(x.p)).sort((a,b)=>"O IR D Q".indexOf(b.st||"z")-"O IR D Q".indexOf(a.st||"z"));
  const names=new Set(all.map(x=>norm(x.p.name)));const mineN=NEWS.filter(n=>names.has(norm(n.player)));
  const lb=x=>x.lg.map(i=>`<span class="own ${i==="WAN"?"":"t"}">${i==="WAN"?"WAN":"SLOPE"}</span>`).join("");
  let h=`<div class="ttl">Injuries & byes · your players</div><div class="card">${hurt.map(x=>`<div class="pr"><div><div class="nm">${esc(x.p.name)}${lb(x)}${x.st?`<span class="tag t${x.st}">${x.st}</span>`:""}${onBye(x.p)?'<span class="tag tBYE">BYE</span>':""}</div><div class="sm">${x.p.pos} ${x.p.team||""}${x.p.inj_part?" · "+esc(x.p.inj_part):""}${x.p.inj_note?" · "+esc(x.p.inj_note):""}</div></div></div>`).join("")||'<div class="empty">Everyone healthy</div>'}</div>`;
  h+=`<div class="ttl">News · your players</div><div class="card">${mineN.map(nw).join("")||'<div class="empty">No recent news on your players yet. The feed fills in as headlines drop.</div>'}</div>`;
  h+=`<div class="ttl">Latest NFL news</div><div class="card">${NEWS.slice(0,25).map(nw).join("")||'<div class="empty">No news loaded</div>'}</div><div class="note">Statuses: ESPN-verified overrides from ${esc(D.rosters.as_of)}, otherwise Sleeper. News: RotoWire feed.</div>`;
  return h}
const nw=n=>`<div class="nw"><div class="h">${esc(n.title)}</div><div class="d">${esc(n.desc)}</div><div class="sm">${esc(n.src)} · ${esc((n.date||"").replace(/:00 (AM|PM)/," $1"))}</div></div>`;
const QC=["Approve lineup","Who should I start?","Grade this trade","Who should I pick up?","Injury check on my team"];
function sheet(t,n,p){openGM(p,t+": "+n)}
function openGM(pre,ctx){$("shN").textContent=ctx||(D?`${lg==="WAN"?"WAN 2027":"Slopeside"} · ${L().my_team}`:"");$("gmT").value=pre||"";
 $("qc").innerHTML=QC.map(q=>`<button onclick="qcp('${q}')">${q}</button>`).join("");$("cpB").textContent="Send";$("gmS").textContent="No direct line to Grok Bot from the app: Send opens your share sheet (or copies) so you can paste it in your Grok Bot chat. The app never touches ESPN.";drawH();$("sheet").style.display="flex"}
function qcp(q){const lt=lg==="WAN"?"WAN":"SLOPESIDE";let t=q;if(q==="Approve lineup"&&D){const x=lineups();t=x.changes.length?`APPROVE ${lt} (${L().my_team}) LINEUP: `+x.changes.map(c=>`start ${c.inP?.name} at ${c.slot}`+(c.outP?`, bench ${c.outP.name}`:"")).join("; "):`${lt} (${L().my_team}): check my lineup, app shows it's already optimal`}
 else t=`${lt} (${D?L().my_team:""}): ${q}${q==="Grade this trade"?" — I give: ___ / I get: ___":""}`;$("gmT").value=t;$("gmT").focus()}
function drawH(){const h=JSON.parse(localStorage.gmHist||"[]");$("hist").innerHTML=h.slice(-15).map(m=>`<div class="bub">${esc(m.t)}<small>${new Date(m.at).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})} · ${m.via}</small></div>`).join("");$("hist").scrollTop=1e6}
function closeSheet(){$("sheet").style.display="none"}
async function sendGM(){const t=$("gmT").value.trim();if(!t)return;let via="copied";
 const cp=()=>{try{if(navigator.clipboard&&isSecureContext){navigator.clipboard.writeText(t)}else{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}}catch(e){}};
 if(navigator.share){try{await navigator.share({text:t});via="shared"}catch(e){if(e.name==="AbortError")return;cp()}}else cp();
 const h=JSON.parse(localStorage.gmHist||"[]");h.push({t,at:Date.now(),via});localStorage.gmHist=JSON.stringify(h.slice(-50));
 $("gmT").value="";drawH();$("cpB").textContent=via==="shared"?"Shared ✓":"Copied ✓";$("gmS").innerHTML=via==="shared"?"<b>Shared. Make sure it lands in your Grok Bot chat.</b>":"<b>Copied, paste it in your Grok Bot chat.</b>"}
function render(){$("tabs").innerHTML=TABS.map(([id,ic,lab])=>`<button class="${tab===id||(tab==="team"&&id==="home")?"on":""}" onclick="tab='${id}';localStorage.tab=tab;render();scrollTo(0,0)"><i>${ic}</i>${lab}</button>`).join("");
  if(!D)return;try{$("main").innerHTML={home:vHome,team:vTeam,rank:vRank,moves:vMoves,news:vNews}[tab]()}catch(e){$("main").innerHTML=`<div class="card dn">Error: ${esc(e.message)}</div>`;console.error(e)}}
render();load().catch(e=>{$("main").innerHTML='<div class="empty">Couldn\'t load data. Tap Refresh.</div>'});
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
